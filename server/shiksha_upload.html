<!doctype html><html lang="de"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SHIKSHA · Dokument schicken</title>
<style>
:root{--ink:#1a1a1a;--soft:#55524b;--mute:#7a7a74;--line:#e6e4de;--accent:#2d7a5f;--accent-soft:#e8f1ec;--alert:#a0391f;--alert-soft:#f5e1da;--bg:#f7f7f5;--mono:"SFMono-Regular",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:32px 22px 80px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--mute)}
h1{font-size:28px;font-weight:600;margin:6px 0 4px;letter-spacing:-0.01em}
.lede{font-size:14px;color:var(--soft);margin:0 0 28px}
.dropzone{border:2px dashed #c6c2b8;border-radius:14px;padding:48px 24px;text-align:center;cursor:pointer;background:#fafaf8;transition:all 0.15s}
.dropzone:hover,.dropzone.drag{border-color:var(--ink);background:var(--accent-soft)}
.dropzone .ic{font-size:42px;line-height:1;margin-bottom:10px}
.dropzone .lbl{font-size:15px;font-weight:600}
.dropzone .sub{font-size:12px;color:var(--mute);margin-top:6px}
input[type=file]{display:none}
.actions{display:flex;gap:8px;margin-top:18px;flex-direction:column}
button{font-family:inherit;font-size:15px;padding:13px 18px;border-radius:10px;border:0;cursor:pointer;font-weight:600}
button.primary{background:var(--ink);color:#fff}
button.primary:disabled{background:#c6c2b8;cursor:not-allowed}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.result{margin-top:24px;padding:16px 18px;border-radius:10px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:14px;display:none}
.result.err{background:var(--alert-soft);border-left-color:var(--alert)}
.result pre{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,0.6);padding:10px;border-radius:6px;overflow-x:auto;margin:8px 0 0}
.file-name{font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:8px;word-break:break-all}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--mute);text-align:center}
footer a{color:var(--soft);text-decoration:none}
</style></head><body>
<div class="app">
<div class="eyebrow">SHIKSHA</div>
<h1>Dokument schicken</h1>
<p class="lede">PDF, Foto, gescannter Beleg — wir lesen den Rest.</p>

<label class="dropzone" id="dz">
  <div class="ic">📄</div>
  <div class="lbl">Datei wählen oder hier ablegen</div>
  <div class="sub">PDF · JPEG · PNG · HEIC · max 25 MB</div>
  <div class="file-name" id="fname"></div>
  <input type="file" id="file" accept="application/pdf,image/*,.heic,.heif"/>
</label>

<div class="actions">
  <button class="primary" id="send" disabled>Hochladen</button>
  <button class="secondary" id="reset" style="display:none">Andere Datei wählen</button>
</div>

<div class="result" id="result"></div>

<footer>shiksha.tun.zone · <a href="/foto">Schnell-Foto-Modus</a> · <a href="/accounting/cockpit">Cockpit</a></footer>
</div>

<script>
const dz=document.getElementById('dz'),fi=document.getElementById('file'),fn=document.getElementById('fname'),btn=document.getElementById('send'),rb=document.getElementById('reset'),res=document.getElementById('result');
let chosen=null;
function pick(f){chosen=f;fn.textContent=f.name+' ('+(f.size/1024).toFixed(0)+' KB)';btn.disabled=false;rb.style.display='block';res.style.display='none'}
fi.addEventListener('change',e=>{if(e.target.files[0])pick(e.target.files[0])});
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])});
rb.addEventListener('click',()=>{chosen=null;fi.value='';fn.textContent='';btn.disabled=true;rb.style.display='none';res.style.display='none'});
btn.addEventListener('click',async()=>{
  if(!chosen)return;
  btn.disabled=true;btn.textContent='Lade hoch …';
  const isPdf=chosen.type==='application/pdf'||chosen.name.toLowerCase().endsWith('.pdf');
  const url=isPdf?'/documents/upload':'/documents/photo';
  const fd=new FormData();fd.append('file',chosen);
  try{
    const r=await fetch(url,{method:'POST',body:fd});
    const txt=await r.text();let body;try{body=JSON.parse(txt)}catch(e){body={raw:txt}}
    res.className='result'+(r.ok?'':' err');
    res.style.display='block';
    res.innerHTML='<strong>'+(r.ok?'Verstanden.':'Fehler '+r.status)+'</strong><pre>'+JSON.stringify(body,null,2)+'</pre>';
    btn.textContent='Hochladen';btn.disabled=false;
  }catch(e){
    res.className='result err';res.style.display='block';
    res.innerHTML='<strong>Netzwerk-Fehler</strong><pre>'+e.message+'</pre>';
    btn.textContent='Hochladen';btn.disabled=false;
  }
});
</script></body></html>
