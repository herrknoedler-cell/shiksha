# =============================================================
# SHIKSHA Engine — nginx Site
# Datei: /etc/nginx/sites-available/api.shiksha.world
# Symlink: ln -s ../sites-available/api.shiksha.world /etc/nginx/sites-enabled/
#
# Voraussetzung: certbot --nginx -d api.shiksha.world (Let's Encrypt)
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.shiksha.world;

    # certbot ACME-Challenge handhabt der Standard-Pfad
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shiksha.world;

    # TLS — wird von certbot via --nginx ausgefüllt
    ssl_certificate     /etc/letsencrypt/live/api.shiksha.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shiksha.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Body-Limit (Chat-Inputs sind klein)
    client_max_body_size 1M;

    # Logging
    access_log /var/log/nginx/shiksha-engine.access.log;
    error_log  /var/log/nginx/shiksha-engine.error.log;

    # ---- SSE-Endpoint braucht spezielle Settings ----
    location /api/v1/chat/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-spezifisch: kein Buffering, lange Timeouts
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     24h;
        proxy_send_timeout     24h;
        chunked_transfer_encoding off;
    }

    # ---- Alle anderen API-Calls ----
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
        proxy_connect_timeout  10s;
    }
}
