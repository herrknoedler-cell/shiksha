[project]
name = "shiksha-engine"
version = "0.1.0"
description = "SHIKSHA Engine — Backend-Proxy + Developer Portal"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Thomas Knödler" }]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "email-validator>=2.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "webauthn>=2.0",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "sse-starlette>=2.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
shiksha-engine = "shiksha_engine.main:run"
shiksha-seed   = "scripts.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shiksha_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
