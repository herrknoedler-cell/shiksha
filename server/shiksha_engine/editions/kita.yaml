edition: kita

vocabulary:
  operator_role:  Trägerin
  org_word:       KITA
  member_word:    Kind
  pain_words:
    - Zettelei
    - Wochenend-Anrufe
    - Personalausfall
    - Eltern-Push
  ritual_time:    "17:30"

tools:
  - log_observation
  - log_friction
  - save_day_summary
  - add_memory

dashboard_cards:
  - kita.st_percent
  - kita.compliance
  - kita.eltern_inbox
  - kita.beobachtungen
  - kita.kalender
  - core.tagesausklang_status

site_template: kita_v3

reminder_default_time: "17:30"

persona_overrides:
  kennenlernen: kennenlernen
  tagesausklang: tagesausklang

# ---------------------------------------------------------------------
# Heim-Karten — KITA-spezifisch (Cross-edition Karten kommen aus core.yaml)
# Spec: SHIKSHA_HEIM_SPEC.md
# ---------------------------------------------------------------------
heim_cards:

  - id: wer_ist_da
    title: "Wer ist da"
    subtitle_template: "{kids_present_count} Kinder · {staff_present_count} Päd."
    icon: presence
    action_url: "/anwesenheit.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: attendance_summary
    time_priority:
      morning: 1
      afternoon: 2
      evening: 7
      night: 8
    category: core

  - id: personalschluessel
    title: "Personalschlüssel"
    subtitle_template: "{ratio_status_label}"
    icon: shield
    action_url: "/anwesenheit.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "developer"]
    data_provider: attendance_summary
    time_priority:
      morning: 2
      afternoon: 3
      evening: 8
      night: 9
    category: core

  - id: anwesenheit_woche
    title: "Anwesenheit Woche"
    subtitle_template: "Ø {avg_present_count} Kinder/Tag"
    icon: history
    action_url: "/anwesenheit.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: attendance_week
    time_priority:
      morning: 5
      afternoon: 5
      evening: 6
      night: 8
    category: core

  - id: heute
    title: "Heute"
    subtitle_template: "{event_count_today} Termine · {staff_count_today} im Haus"
    icon: sun
    action_url: "/kalender.html?view=tag"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: calendar_summary
    time_priority:
      morning: 1
      afternoon: 2
      evening: 6
      night: 8
    category: core

  - id: diese_woche
    title: "Diese Woche"
    subtitle_template: "{event_count_week} Termine"
    icon: calendar-week
    action_url: "/kalender.html?view=woche"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: calendar_summary
    time_priority:
      morning: 3
      afternoon: 4
      evening: 5
      night: 7
    category: core

  - id: kalender
    title: "Kalender"
    subtitle_template: ""
    icon: calendar
    action_url: "/kalender.html?view=monat"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "eltern", "developer"]
    time_priority:
      morning: 7
      afternoon: 7
      evening: 7
      night: 9
    category: core

  - id: personal_heute
    title: "Personal heute"
    subtitle_template: "Wer ist da, wer fehlt"
    icon: team
    action_url: "/personen.html?tab=staff"
    edition_scope: ["kita"]
    role_scope: ["leitung", "developer"]
    time_priority:
      morning: 2
      afternoon: 4
      evening: 7
      night: 8
    category: core

  - id: stammdaten
    title: "Stammdaten"
    subtitle_template: "Kinder und Mitarbeiter pflegen"
    icon: book
    action_url: "/personen.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "developer"]
    time_priority:
      morning: 8
      afternoon: 8
      evening: 8
      night: 9
    category: admin

  - id: abholer_pruefen
    title: "Abholer prüfen"
    subtitle_template: "{subtitle}"
    icon: shield
    action_url: "/identity.html?filter=pending"
    edition_scope: ["kita"]
    role_scope: ["padagoge", "leitung", "developer"]
    data_provider: identity_summary
    time_priority:
      morning: 5
      afternoon: 3
      evening: 4
      night: 8
    category: tools
    # Konzept-Vorbereitung (SHIKSHA_DESIGN_KONZEPT.md §3.3 + §10) —
    # vom aktuellen heim_loader.py via .get() ignoriert, vorwärtskompatibel
    # für späteren heim.html-Refactor.
    size: "2x2"
    holi_border: "tuerkis"
