edition: kita

vocabulary:
  operator_role:  Trägerin
  org_word:       KITA
  member_word:    Kind
  pain_words:
    - Zettelei
    - Wochenend-Anrufe
    - Personalausfall
    - Eltern-Push
  ritual_time:    "17:30"

tools:
  - log_observation
  - log_friction
  - save_day_summary
  - add_memory

dashboard_cards:
  - kita.st_percent
  - kita.compliance
  - kita.eltern_inbox
  - kita.beobachtungen
  - kita.kalender
  - core.tagesausklang_status

site_template: kita_v3

reminder_default_time: "17:30"

persona_overrides:
  kennenlernen: kennenlernen
  tagesausklang: tagesausklang

# ---------------------------------------------------------------------
# Heim-Karten — KITA-spezifisch (Cross-edition Karten kommen aus core.yaml)
# Spec: SHIKSHA_HEIM_SPEC.md
# ---------------------------------------------------------------------
heim_cards:

  - id: wer_ist_da
    title: "Wer ist da"
    subtitle_template: "{kids_present_count} Kinder · {staff_present_count} Päd."
    icon: presence
    action_url: "/anwesenheit.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: attendance_summary
    time_priority:
      morning: 1
      afternoon: 2
      evening: 7
      night: 8
    category: core

  - id: personalschluessel
    title: "Personalschlüssel"
    subtitle_template: "{ratio_status_label}"
    icon: shield
    action_url: "/anwesenheit.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "developer"]
    data_provider: attendance_summary
    time_priority:
      morning: 2
      afternoon: 3
      evening: 8
      night: 9
    category: core

  - id: anwesenheit_woche
    title: "Anwesenheit Woche"
    subtitle_template: "Ø {avg_present_count} Kinder/Tag"
    icon: history
    action_url: "/anwesenheit.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: attendance_week
    time_priority:
      morning: 5
      afternoon: 5
      evening: 6
      night: 8
    category: core

  - id: heute
    title: "Heute"
    subtitle_template: "{event_count_today} Termine · {staff_count_today} im Haus"
    icon: sun
    action_url: "/kalender.html?view=tag"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: calendar_summary
    time_priority:
      morning: 1
      afternoon: 2
      evening: 6
      night: 8
    category: core

  - id: diese_woche
    title: "Diese Woche"
    subtitle_template: "{event_count_week} Termine"
    icon: calendar-week
    action_url: "/kalender.html?view=woche"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "developer"]
    data_provider: calendar_summary
    time_priority:
      morning: 3
      afternoon: 4
      evening: 5
      night: 7
    category: core

  - id: kalender
    title: "Kalender"
    subtitle_template: ""
    icon: calendar
    action_url: "/kalender.html?view=monat"
    edition_scope: ["kita"]
    role_scope: ["leitung", "padagoge", "eltern", "developer"]
    time_priority:
      morning: 7
      afternoon: 7
      evening: 7
      night: 9
    category: core

  - id: personal_heute
    title: "Personal heute"
    subtitle_template: "Wer ist da, wer fehlt"
    icon: team
    action_url: "/personen.html?tab=staff"
    edition_scope: ["kita"]
    role_scope: ["leitung", "developer"]
    time_priority:
      morning: 2
      afternoon: 4
      evening: 7
      night: 8
    category: core

  - id: stammdaten
    title: "Stammdaten"
    subtitle_template: "Kinder und Mitarbeiter pflegen"
    icon: book
    action_url: "/personen.html"
    edition_scope: ["kita"]
    role_scope: ["leitung", "developer"]
    time_priority:
      morning: 8
      afternoon: 8
      evening: 8
      night: 9
    category: admin

  - id: abholer_pruefen
    title: "Abholer prüfen"
    subtitle_template: "{subtitle}"
    icon: shield
    action_url: "/identity.html?filter=pending"
    edition_scope: ["kita"]
    role_scope: ["padagoge", "leitung", "developer"]
    data_provider: identity_summary
    time_priority:
      morning: 5
      afternoon: 3
      evening: 4
      night: 8
    category: tools
    # Konzept-Vorbereitung (SHIKSHA_HEIM_LAYOUT_SPEC §3) — vom
    # heim_loader durchgereicht, im 4x6-Grid via heim_layouts platziert.
    size: "2x2"
    holi_border: "tuerkis"


# ---------------------------------------------------------------------
# Heim-Layouts — feste Page-Strukturen pro Rolle (5.5.D.5)
# Spec: docs/specs/SHIKSHA_HEIM_LAYOUT_SPEC.md
# Grid: 4 Spalten × 6 Reihen, position [col, row] ist 0-basiert.
# Karten-Types die hier auftauchen aber keinen Provider haben:
# werden als Placeholder-Tile gerendert ("Karte noch nicht implementiert").
# ---------------------------------------------------------------------
heim_layouts:
  schema_version: 1

  leitung:
    - page_id: heute
      label: "Heute"
      cards:
        - {type: wer_ist_da,            size: "4x2", position: [0, 0]}
        - {type: dayclock,              size: "4x3", position: [0, 2]}
        - {type: abholer_pruefen,       size: "2x2", position: [0, 5]}
        - {type: action_neue_erfassung, size: "1x1", position: [2, 5],
           title: "Erfassung",     icon: shield, accent: "warm",
           url: "/identity.html"}
        - {type: action_anwesenheit,    size: "1x1", position: [3, 5],
           title: "Anwesenheit",   icon: presence, accent: "cool",
           url: "/anwesenheit.html"}

    - page_id: wochenplan
      label: "Wochenplan"
      cards:
        - {type: diese_woche,           size: "4x3", position: [0, 0]}
        - {type: anwesenheit_woche,     size: "2x2", position: [0, 3]}
        - {type: geburtstage_woche,     size: "2x2", position: [2, 3]}
        - {type: action_kalender,       size: "4x1", position: [0, 5],
           title: "Kalender öffnen", icon: calendar, accent: "warm",
           url: "/kalender.html"}

    - page_id: verwaltung
      label: "Verwaltung"
      cards:
        - {type: stammdaten,            size: "2x2", position: [0, 0]}
        - {type: personal_heute,        size: "2x2", position: [2, 0]}
        - {type: lizenzen,              size: "2x2", position: [0, 2]}
        - {type: operatoren_status,     size: "2x2", position: [2, 2]}
        - {type: tech_schuld,           size: "4x2", position: [0, 4]}

    - page_id: gespraeche
      label: "Gespräche"
      cards:
        - {type: gespraeche_modul,      size: "4x6", position: [0, 0]}

  padagoge:
    - page_id: meine_gruppe_heute
      label: "Meine Gruppe heute"
      cards:
        - {type: wer_ist_da,            size: "4x2", position: [0, 0]}
        - {type: dayclock,              size: "4x3", position: [0, 2]}
        - {type: abholer_pruefen,       size: "2x2", position: [0, 5]}
        - {type: action_anwesenheit,    size: "2x1", position: [2, 5],
           title: "Anwesenheit",   icon: presence, accent: "cool",
           url: "/anwesenheit.html"}

    - page_id: kinder_eltern
      label: "Kinder und Eltern"
      cards:
        - {type: kinder_liste_gruppe,   size: "4x3", position: [0, 0]}
        - {type: eltern_kontakte,       size: "2x2", position: [0, 3]}
        - {type: abholberechtigte,      size: "2x2", position: [2, 3]}
        - {type: action_neue_notiz,     size: "1x1", position: [0, 5],
           title: "Notiz",         icon: pencil, accent: "warm",
           url: "/personen.html"}
        - {type: action_eltern_msg,     size: "1x1", position: [1, 5],
           title: "Eltern-Nachricht", icon: chat, accent: "cool",
           url: "/personen.html"}

    - page_id: gespraeche
      label: "Gespräche"
      cards:
        - {type: gespraeche_modul,      size: "4x6", position: [0, 0]}

  # Eltern-Layout kommt mit Phase-2-Onboarding (Eltern-App via Bridge,
  # Eltern-Token-Mechanik). Bewusst leer.
  eltern: []

  developer:
    # Developer erbt das Leitungs-Layout (gleiche Sicht).
    # Wenn später Developer-spezifische Pages nötig: hier ergänzen.
    - page_id: heute
      label: "Heute (developer)"
      cards:
        - {type: wer_ist_da,            size: "4x2", position: [0, 0]}
        - {type: dayclock,              size: "4x3", position: [0, 2]}
        - {type: abholer_pruefen,       size: "2x2", position: [0, 5]}
        - {type: action_neue_erfassung, size: "1x1", position: [2, 5],
           title: "Erfassung",     icon: shield, accent: "warm",
           url: "/identity.html"}
        - {type: action_anwesenheit,    size: "1x1", position: [3, 5],
           title: "Anwesenheit",   icon: presence, accent: "cool",
           url: "/anwesenheit.html"}
