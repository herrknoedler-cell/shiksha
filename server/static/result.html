<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHIKSHA — Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body {
    min-height: 100vh;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 300; color: #1a1a1a;
    background: linear-gradient(180deg, #0b0b0b 0%, #0b0b0b 18%, #2a2a2a 38%, #8a8a8a 62%, #e8e8e8 82%, #ffffff 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    display: flex; justify-content: center; align-items: flex-start; padding: 0 24px;
  }
  .stage {
    width: 100%; max-width: 700px; min-height: 100vh;
    display: flex; flex-direction: column;
    padding-top: 18vh; padding-bottom: 8vh;
    opacity: 0; animation: fadeIn 1.4s ease-out 0.15s forwards;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); margin-bottom: 14vh; }
  .brand-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3ea5; box-shadow: 0 0 0 3px rgba(255, 62, 165, 0.15); }
  .headline { font-size: clamp(26px, 3.6vw, 38px); line-height: 1.35; font-weight: 300; color: #f4f4f4; letter-spacing: -0.01em; margin-bottom: 10vh; }
  .headline .amount { color: #ffb347; font-weight: 500; }
  .headline .entity { color: #ffffff; font-weight: 500; }
  .headline .due    { color: #3ed6c5; font-weight: 500; }
  .data { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-bottom: 8vh; padding: 28px 0; border-top: 1px solid rgba(200, 200, 200, 0.25); border-bottom: 1px solid rgba(200, 200, 200, 0.25); }
  .data-item { display: flex; flex-direction: column; gap: 6px; }
  .data-label { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(180, 180, 180, 0.75); }
  .data-value { font-size: 17px; font-weight: 400; color: #2a2a2a; }
  .entity-block { margin-bottom: 4vh; }
  .entity-label { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a7a7a; margin-bottom: 10px; }
  .entity-name { font-size: 20px; font-weight: 400; color: #1a1a1a; display: inline-flex; align-items: center; gap: 10px; }
  .entity-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff3ea5; }
  .entity-prob { font-size: 13px; color: #999; font-weight: 400; margin-left: 4px; }
  .uncertainty { font-size: 13px; font-weight: 400; color: #888; display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px dashed rgba(0, 0, 0, 0.12); }
  .uncertainty::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3ed6c5; flex-shrink: 0; }
  @media (max-width: 560px) {
    .stage { padding-top: 14vh; }
    .data { grid-template-columns: 1fr; gap: 20px; }
    .brand { margin-bottom: 10vh; }
    .headline { margin-bottom: 8vh; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>SHIKSHA · Result</span>
    </div>
    <h1 class="headline">
      Diese Rechnung über <span class="amount">250,00&nbsp;€</span>
      stammt wahrscheinlich von <span class="entity">Lunchbox Gastro GmbH</span>
      und ist am <span class="due">15. April</span> fällig.
    </h1>
    <section class="data" aria-label="Kerndaten">
      <div class="data-item"><span class="data-label">Betrag</span><span class="data-value">250,00&nbsp;€</span></div>
      <div class="data-item"><span class="data-label">Fällig</span><span class="data-value">15. April 2026</span></div>
      <div class="data-item"><span class="data-label">Referenz</span><span class="data-value">RE-2026-041</span></div>
    </section>
    <div class="entity-block">
      <div class="entity-label">Entity</div>
      <div class="entity-name">Lunchbox Gastro GmbH <span class="entity-prob">· wahrscheinlich</span></div>
    </div>
    <div class="uncertainty">IBAN sollte geprüft werden.</div>
  </main>
</body>
</html>
