<!DOCTYPE html>
<html lang="de" data-edition="kita">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SHIKSHA · Heim</title>

  <!-- Pre-Render Theme-Restore — verhindert FOUC beim Theme-Switch -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('shiksha-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Design-System v1.1 (Card-Size-Modifier, Heim-Slider, shk-action) -->
  <link rel="stylesheet" href="./shiksha-ui.v1.1.0.css">
  <link rel="stylesheet" href="./editions-css/kita.v1.0.0.css">
</head>
<body data-context="heim">

  <!-- Icon-Sprite-Referenz -->
  <svg style="display:none" aria-hidden="true">
    <use href="./shiksha-icons.v1.0.0.svg#icon-default"/>
  </svg>

  <!-- Header bleibt minimal — Greeting + Theme-Toggle, kompakt am oberen Rand -->
  <header class="shk-header" style="padding: var(--shk-space-md);">
    <div class="shk-row" style="justify-content: space-between; align-items: flex-start;">
      <div>
        <h1 class="shk-display shk-fade-in" id="greeting">&nbsp;</h1>
      </div>
      <button class="shk-theme-toggle shk-fade-in"
              data-shk-theme-toggle
              aria-label="Theme umschalten">
        <svg class="shk-icon shk-icon--sm">
          <use href="./shiksha-icons.v1.0.0.svg#icon-weather-sun"/>
        </svg>
        <span data-shk-theme-label>Modus</span>
      </button>
    </div>
  </header>

  <!-- Heim-Slider — wird per JS mit Pages befüllt -->
  <main class="shk-heim-slider" id="heim-slider" role="main">
    <div class="shk-loading" id="loading" style="padding: var(--shk-space-lg);">Einen Moment.</div>
  </main>


  <!-- ===== Card-Template (klassische Karte) ===== -->
  <template id="card-template">
    <article class="shk-card">
      <div class="shk-card__icon">
        <svg><use href=""/></svg>
      </div>
      <div class="shk-card__body">
        <h2 class="shk-card__title"></h2>
        <p class="shk-card__subtitle"></p>
      </div>
    </article>
  </template>

  <!-- ===== Action-Template (Tile-Button) ===== -->
  <template id="action-template">
    <button class="shk-action" type="button">
      <svg class="shk-action__icon"><use href=""/></svg>
      <span class="shk-action__label"></span>
    </button>
  </template>

  <!-- ===== Dayclock-Template ===== -->
  <template id="dayclock-template">
    <article class="shk-card">
      <div class="shk-card__body" style="display:flex; align-items:center; justify-content:center;">
        <div data-dayclock-mount></div>
      </div>
    </article>
  </template>


  <!-- ===== Anwendungs-Skript ===== -->
  <script type="module">
    import { ShikshaClient, ShikshaAuthError } from './shiksha-client.js';
    import {
      initShikshaUI,
      initHeimSlider,
      renderDayClock,
    } from './shiksha-ui.v1.1.0.js';

    // -------------------------------------------------------------
    // Auth-Gate
    // -------------------------------------------------------------
    const client = new ShikshaClient();
    if (!client.hasValidToken()) {
      const nextParam = encodeURIComponent(location.pathname + location.search);
      location.replace(`./presence_switch.html?next=${nextParam}`);
    }

    initShikshaUI({ context: 'heim' });

    // -------------------------------------------------------------
    // Refs
    // -------------------------------------------------------------
    const greetingEl  = document.getElementById('greeting');
    const sliderEl    = document.getElementById('heim-slider');
    const cardTpl     = document.getElementById('card-template');
    const actionTpl   = document.getElementById('action-template');
    const dayclockTpl = document.getElementById('dayclock-template');

    const ICON_FALLBACK = 'default';
    const KNOWN_ICONS = new Set([
      'candle', 'bookmark', 'presence', 'team', 'shield', 'shield-check',
      'clock', 'home', 'calendar', 'calendar-week', 'chat', 'history',
      'settings', 'gear', 'plus', 'pencil', 'trash', 'check', 'share',
      'info', 'warning', 'error', 'ok', 'default',
      'weather-sun', 'weather-cloud', 'weather-rain', 'weather-snow', 'weather-fog',
      'person', 'users', 'parent-child', 'baby', 'book', 'sun',
    ]);

    function iconRef(iconName) {
      const name = (iconName && KNOWN_ICONS.has(iconName)) ? iconName : ICON_FALLBACK;
      return `./shiksha-icons.v1.0.0.svg#icon-${name}`;
    }

    // -------------------------------------------------------------
    // Card-Rendering
    // -------------------------------------------------------------

    function applyGridSlot(el, card) {
      // size = "WxH", position = [col, row], beide 0-basiert
      const [col, row] = card.position || [0, 0];
      const [w, h] = (card.size || '1x1').split('x').map(s => parseInt(s, 10) || 1);
      // CSS Grid ist 1-basiert
      el.style.gridColumn = `${col + 1} / span ${w}`;
      el.style.gridRow    = `${row + 1} / span ${h}`;
      el.classList.add(`shk-card--size-${card.size || '1x1'}`);
    }

    function renderClassicCard(card) {
      const node = cardTpl.content.firstElementChild.cloneNode(true);
      node.setAttribute('data-type', card.type);

      if (card.placeholder) {
        node.classList.add('shk-card--placeholder');
      }

      // Icon
      const useEl = node.querySelector('.shk-card__icon use');
      useEl.setAttribute('href', iconRef(card.icon));

      // Texte
      node.querySelector('.shk-card__title').textContent = card.title || '';
      const subEl = node.querySelector('.shk-card__subtitle');
      if (card.subtitle) {
        subEl.textContent = card.subtitle;
      } else {
        subEl.remove();
      }

      // Tap-Ziel
      if (card.url && !card.placeholder) {
        node.style.cursor = 'pointer';
        node.addEventListener('click', () => { window.location.href = card.url; });
      }

      return node;
    }

    function renderAction(card) {
      const node = actionTpl.content.firstElementChild.cloneNode(true);
      node.setAttribute('data-type', card.type);

      // Akzent-Variante
      const accent = (card.accent || 'warm').toLowerCase();
      const accentMap = {
        warm: 'accent-warm',
        cool: 'accent-cool',
        info: 'status-info',
        warn: 'status-warn',
      };
      const cls = accentMap[accent] || 'accent-warm';
      node.classList.add(`shk-action--${cls}`);

      node.querySelector('.shk-action__icon use').setAttribute('href', iconRef(card.icon));
      node.querySelector('.shk-action__label').textContent = card.title || '';

      if (card.url) {
        node.addEventListener('click', () => { window.location.href = card.url; });
      }

      return node;
    }

    function renderDayclockTile(card) {
      const node = dayclockTpl.content.firstElementChild.cloneNode(true);
      const mount = node.querySelector('[data-dayclock-mount]');
      // Defensive: wenn renderDayClock crash, Card bleibt sichtbar
      try {
        renderDayClock(mount, { size: 220 });
      } catch (err) {
        console.warn('Dayclock-Render fehlgeschlagen', err);
        mount.textContent = 'Tages-Uhr';
      }
      return node;
    }

    function renderCard(card) {
      let el;
      if ((card.type || '').startsWith('action_')) {
        el = renderAction(card);
      } else if (card.type === 'dayclock') {
        el = renderDayclockTile(card);
      } else {
        el = renderClassicCard(card);
      }
      applyGridSlot(el, card);
      return el;
    }

    // -------------------------------------------------------------
    // Page + Slider-Rendering
    // -------------------------------------------------------------

    function renderPage(page) {
      const section = document.createElement('section');
      section.className = 'shk-heim-page';
      section.dataset.pageId = page.page_id;
      section.setAttribute('aria-label', page.label || page.page_id);

      (page.cards || []).forEach(card => {
        section.appendChild(renderCard(card));
      });

      return section;
    }

    function renderHeim(heim) {
      greetingEl.textContent = heim.greeting || '';
      sliderEl.innerHTML = '';

      // Pages-Pfad (5.5.D.5)
      if (Array.isArray(heim.pages) && heim.pages.length > 0) {
        const frag = document.createDocumentFragment();
        heim.pages.forEach(page => frag.appendChild(renderPage(page)));
        sliderEl.appendChild(frag);
        initHeimSlider(sliderEl);
        return;
      }

      // Fallback: flache cards-Liste in einer einzelnen Page rendern
      const fallback = document.createElement('section');
      fallback.className = 'shk-heim-page';
      fallback.setAttribute('aria-label', 'Heim');
      (heim.cards || []).forEach((card, i) => {
        // Synthetische Position: 2-spaltig, automatischer Stack
        const synth = {
          type: card.id,
          size: card.size || '2x2',
          position: [(i % 2) * 2, Math.floor(i / 2) * 2],
          title: card.title,
          subtitle: card.subtitle,
          icon: card.icon,
          url: card.action_url,
          placeholder: false,
        };
        fallback.appendChild(renderCard(synth));
      });
      sliderEl.appendChild(fallback);
    }

    function renderError(text) {
      sliderEl.innerHTML = `<div class="shk-error-block" style="padding: var(--shk-space-lg);">${text}</div>`;
    }

    // -------------------------------------------------------------
    // Laden
    // -------------------------------------------------------------
    async function load() {
      try {
        const heim = await client.getHeim();
        renderHeim(heim);
      } catch (err) {
        if (err instanceof ShikshaAuthError) {
          const nextParam = encodeURIComponent(location.pathname + location.search);
          location.replace(`./presence_switch.html?next=${nextParam}`);
          return;
        }
        console.warn('Heim konnte nicht geladen werden', err);
        renderError('Heim konnte gerade nicht geladen werden. Lade einmal neu.');
      }
    }

    load();
  </script>
</body>
</html>
