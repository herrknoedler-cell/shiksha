<!DOCTYPE html>
<html lang="de" data-edition="kita">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SHIKSHA · Heim</title>

  <!-- Pre-Render Theme-Restore — verhindert FOUC beim Theme-Switch -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('shiksha-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Design-System: Basis + KITA-Edition-Overrides -->
  <link rel="stylesheet" href="./shiksha-ui.v1.0.0.css">
  <link rel="stylesheet" href="./editions-css/kita.v1.0.0.css">
</head>
<body>

  <!-- ========================================================
       Icon-Sprite — einmal referenziert, von allen Karten genutzt
       ======================================================== -->
  <svg style="display:none" aria-hidden="true">
    <use href="./shiksha-icons.v1.0.0.svg#icon-default"/>
  </svg>

  <div class="shk-shell">

    <!-- ========================================================
         HEADER  —  Greeting + Theme-Toggle
         ======================================================== -->
    <header class="shk-header">
      <div class="shk-row" style="justify-content: space-between; align-items: flex-start;">
        <div>
          <h1 class="shk-display shk-fade-in" id="greeting">&nbsp;</h1>
          <p class="shk-subtitle shk-fade-in" id="context" style="margin-top: var(--shk-space-sm);"></p>
        </div>
        <button class="shk-theme-toggle shk-fade-in"
                data-shk-theme-toggle
                aria-label="Theme umschalten">
          <svg class="shk-icon shk-icon--sm">
            <use href="./shiksha-icons.v1.0.0.svg#icon-weather-sun"/>
          </svg>
          <span data-shk-theme-label>Modus</span>
        </button>
      </div>
    </header>

    <!-- ========================================================
         KARTEN-GRID
         ======================================================== -->
    <main class="shk-grid" id="cards-grid">
      <div class="shk-loading" id="loading">Einen Moment.</div>
    </main>

    <footer style="margin-top: auto; padding-top: var(--shk-space-lg); text-align: center;">
      <span class="shk-text-tiny shk-text-faint" style="letter-spacing: var(--shk-tracking-wide);">SHIKSHA</span>
    </footer>
  </div>


  <!-- ========================================================
       Karten-Template — wird per JS geklont
       ======================================================== -->
  <template id="card-template">
    <a class="shk-card" href="#">
      <div class="shk-card__icon">
        <svg><use href=""/></svg>
      </div>
      <div class="shk-card__body">
        <h2 class="shk-card__title"></h2>
        <p class="shk-card__subtitle"></p>
      </div>
    </a>
  </template>


  <!-- ========================================================
       Anwendungs-Skript
       ======================================================== -->
  <script type="module">
    import { ShikshaClient, ShikshaAuthError } from './shiksha-client.js';
    import {
      initShikshaUI,
      avatarInitials,
    } from './shiksha-ui.v1.0.0.js';

    // -------------------------------------------------------------
    // Auth-Gate — vor allem anderen
    // -------------------------------------------------------------
    const client = new ShikshaClient();

    if (!client.hasValidToken()) {
      const nextParam = encodeURIComponent(location.pathname + location.search);
      location.replace(`./presence_switch.html?next=${nextParam}`);
    }

    // -------------------------------------------------------------
    // Design-System initialisieren
    //   - Theme aus localStorage wiederherstellen
    //   - Theming-Engine starten (data-time/data-season/data-context)
    //   - Auto-bind aller [data-shk-theme-toggle], Modals, Tabs
    // -------------------------------------------------------------
    initShikshaUI({ context: 'heim' });

    // -------------------------------------------------------------
    // Rendering
    // -------------------------------------------------------------
    const greetingEl = document.getElementById('greeting');
    const contextEl  = document.getElementById('context');
    const gridEl     = document.getElementById('cards-grid');
    const cardTpl    = document.getElementById('card-template');

    const ICON_FALLBACK = 'default';
    const KNOWN_ICONS = new Set([
      // Heim-Karten
      'candle', 'bookmark', 'presence', 'team', 'shield', 'clock',
      // Navigation
      'home', 'calendar', 'chat', 'history', 'settings', 'gear',
      // Aktionen
      'plus', 'pencil', 'trash', 'check', 'share',
      // Status
      'info', 'warning', 'error', 'ok',
      // Wetter
      'weather-sun', 'weather-cloud', 'weather-rain', 'weather-snow', 'weather-fog',
      // Personen
      'person', 'users', 'parent-child', 'baby',
    ]);

    function iconRef(iconName) {
      const name = (iconName && KNOWN_ICONS.has(iconName)) ? iconName : ICON_FALLBACK;
      return `./shiksha-icons.v1.0.0.svg#icon-${name}`;
    }

    function renderCard(card) {
      const node = cardTpl.content.firstElementChild.cloneNode(true);

      node.setAttribute('href', card.action_url || '#');
      node.setAttribute('data-id', card.id);

      // Kategorie als Modifier-Klasse (admin wird dezenter dargestellt)
      if (card.category === 'admin') {
        node.classList.add('shk-card--admin');
      }
      if (card.category === 'feature') {
        node.classList.add('shk-card--feature');
      }

      // Icon einsetzen
      const use = node.querySelector('.shk-card__icon use');
      use.setAttribute('href', iconRef(card.icon));

      // Texte
      node.querySelector('.shk-card__title').textContent = card.title || '';
      const sub = node.querySelector('.shk-card__subtitle');
      if (card.subtitle) {
        sub.textContent = card.subtitle;
      } else {
        sub.remove();
      }

      return node;
    }

    function renderHeim(heim) {
      greetingEl.textContent = heim.greeting || '';
      contextEl.textContent = '';

      gridEl.innerHTML = '';
      if (!heim.cards || heim.cards.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'shk-empty';
        empty.textContent = 'Hier wird Dein Zugang gleich vorbereitet.';
        gridEl.appendChild(empty);
        return;
      }

      const frag = document.createDocumentFragment();
      heim.cards.forEach(card => frag.appendChild(renderCard(card)));
      gridEl.appendChild(frag);
    }

    function renderError(text) {
      gridEl.innerHTML = '';
      const err = document.createElement('div');
      err.className = 'shk-error-block';
      err.textContent = text;
      gridEl.appendChild(err);
    }

    // -------------------------------------------------------------
    // Ladevorgang
    // -------------------------------------------------------------
    async function load() {
      try {
        const heim = await client.getHeim();
        renderHeim(heim);
      } catch (err) {
        if (err instanceof ShikshaAuthError) {
          const nextParam = encodeURIComponent(location.pathname + location.search);
          location.replace(`./presence_switch.html?next=${nextParam}`);
          return;
        }
        console.warn('Heim konnte nicht geladen werden', err);
        renderError('Heim konnte gerade nicht geladen werden. Lade einmal neu.');
      }
    }

    load();
  </script>
</body>
</html>
